[package]
name = "stashdesk"
version = "0.1.0"
description = "Simple web-based file manager"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.33"
sqlx = { version = "0.9.0", features = ["sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
